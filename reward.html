<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reward Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #000;
  font-family: Consolas, "Courier New", monospace;
  color: #b4f5c1;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Console frame */
.console {
  width: 90%;
  max-width: 900px;
  height: 90%;
  max-height: 650px;
  background: #020617;
  border: 1px solid #1f2933;
  border-radius: 8px;
  box-shadow: 0 0 25px rgba(0,255,140,0.2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Header */
.header {
  height: 32px;
  background: #04101e;
  border-bottom: 1px solid #1f2933;
  display: flex;
  align-items: center;
  padding: 0 12px;
  color: #6b7280;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin-right: 5px;
}
.red { background: #ff5f57; }
.yellow { background: #febc2e; }
.green { background: #28c840; }

/* Body */
.body {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  position: relative;
}

/* Scanlines */
.body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.03) 0px,
    rgba(0,0,0,0.15) 2px
  );
  pointer-events: none;
  opacity: 0.2;
}

/* Form */
label {
  display: block;
  margin-bottom: 6px;
  font-size: 14px;
  color: #9be7b3;
}

input {
  width: 100%;
  padding: 8px;
  margin-bottom: 14px;
  background: #04101e;
  border: 1px solid #1f2933;
  border-radius: 4px;
  color: #b4f5c1;
  font-family: inherit;
}

button {
  width: 100%;
  padding: 10px;
  background: #166534;
  border: 1px solid #22c55e;
  border-radius: 4px;
  color: #ecfdf5;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  cursor: pointer;
  margin-bottom: 20px;
}

button:disabled {
  background: #0a2a18;
  border-color: #1f3d2a;
  color: #4b5f52;
  cursor: not-allowed;
}

button:hover:not(:disabled) {
  background: #1a7a42;
}

/* Meter sections */
.meter-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 25px;
}

/* Main reward meter */
.meter {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background:
    radial-gradient(circle, #052e16 40%, transparent 41%),
    conic-gradient(#00ff88 0%, #1f2933 0);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #bbf7d0;
  font-size: 22px;
  font-weight: bold;
  text-shadow: 0 0 6px rgba(0,255,140,0.8);
}

/* Labels */
.meter-label {
  margin-top: 12px;
  font-size: 16px;
  color: #9be7b3;
  letter-spacing: 0.12em;
}

/* Extra reward text */
.extra-section {
  display: none;
  flex-direction: column;
  align-items: center;
  margin-top: 30px;
}

.extra-label {
  font-size: 20px;
  color: #ff3355;
  letter-spacing: 0.12em;
  margin-bottom: 10px;
}

.extra-value {
  font-size: 40px;
  color: #ffe45c;
  font-weight: bold;
  text-shadow: 0 0 10px rgba(255,228,92,0.8);
}

/* Footer */
.footer {
  height: 60px;
  border-top: 1px solid #1f2933;
  background: #04101e;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  padding: 0 20px;
}

.back {
  padding: 10px 26px;
  border-radius: 999px;
  border: 1px solid #22c55e;
  background: radial-gradient(circle at top, #22c55e 0%, #166534 60%, #052e16 100%);
  color: #ecfdf5;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  font-size: 11px;
  text-decoration: none;
  box-shadow: 0 0 14px rgba(34,197,94,0.6);
}

.back:hover {
  border-color: #4ade80;
  box-shadow: 0 0 20px rgba(74,222,128,0.8);
}
</style>
</head>

<body>

<div class="console">

  <div class="header">
    <div class="dot red"></div>
    <div class="dot yellow"></div>
    <div class="dot green"></div>
    REWARD CALCULATOR // CZCOINS MODULE
  </div>

  <div class="body">

    <label>Levels Passed (max 10)</label>
    <input id="levels" type="number" min="0" max="10" placeholder="0–10" oninput="validateInputs()">

    <label>Achievements Unlocked (max 15)</label>
    <input id="achievements" type="number" min="0" max="15" placeholder="0–15" oninput="validateInputs()">

    <button id="calcBtn" onclick="calculateReward()" disabled>CALCULATE</button>

    <!-- Main reward -->
    <div class="meter-section">
      <div class="meter" id="meter">0</div>
      <div class="meter-label">Reward</div>
    </div>

    <!-- Extra reward text -->
    <div class="extra-section" id="extraSection">
      <div class="extra-label">Extra reward unlocked!</div>
      <div class="extra-value">5500</div>
    </div>

  </div>

  <div class="footer">
    <a href="index.html" class="back">BACK</a>
  </div>

</div>

<script>
function validateInputs() {
  const levels = Number(document.getElementById('levels').value);
  const achievements = Number(document.getElementById('achievements').value);

  const validLevels = levels >= 0 && levels <= 10;
  const validAchievements = achievements >= 0 && achievements <= 15;

  document.getElementById('calcBtn').disabled = !(validLevels && validAchievements);
}

function animateNumber(element, target) {
  let current = 0;
  const duration = 1000;
  const startTime = performance.now();

  function update(now) {
    const progress = Math.min((now - startTime) / duration, 1);
    const value = Math.floor(progress * target);
    element.textContent = value;

    if (progress < 1) {
      requestAnimationFrame(update);
    }
  }

  requestAnimationFrame(update);
}

function animateProgressBar(element, percent) {
  let current = 0;
  const duration = 1000;
  const startTime = performance.now();

  function update(now) {
    const progress = Math.min((now - startTime) / duration, 1);
    const value = progress * percent;

    element.style.background = `
      radial-gradient(circle, #052e16 40%, transparent 41%),
      conic-gradient(#00ff88 ${value}%, #1f2933 0)
    `;

    if (progress < 1) {
      requestAnimationFrame(update);
    }
  }

  requestAnimationFrame(update);
}

function calculateReward() {
  const levels = Number(document.getElementById('levels').value);
  const achievements = Number(document.getElementById('achievements').value);

  const reward = levels * 1000 + achievements * 300;

  const meter = document.getElementById('meter');
  const extraSection = document.getElementById('extraSection');

  const percent = (reward / 14500) * 100;

  animateProgressBar(meter, percent);
  animateNumber(meter, reward);

  if (reward === 14500) {
    extraSection.style.display = "flex";
  } else {
    extraSection.style.display = "none";
  }
}
</script>

</body>
</html>
